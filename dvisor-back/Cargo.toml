[package]
name = "dvisor-back"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
getrandom = { version = "0.2.16", features = ["js"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
chrono = "0.4.38"
parquet = { version = "15.0", default-features = false, features = [ "brotli", "flate2", "snap"] }
regex = "1.11.2"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = { version = "0.2.103" }
console_error_panic_hook = "0.1"
js-sys = "0.3.80"
web-sys = { version = "0.3.80", features = [ "console" ] }
strsim = "0.11"

