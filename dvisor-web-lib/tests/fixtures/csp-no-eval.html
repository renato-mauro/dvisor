<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Everything dvisor needs except 'unsafe-eval', which merging partial
     results requires: used by tests/dvisor-errors.spec.js. -->
<meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; worker-src blob:; connect-src 'self'">
</head>
<body>
<script type="module">
    import { Dvisor, DvisorError } from '/dist/index.js';

    const from = `${location.origin}/tests/data/lineitem-sf1.parquet`;

    window.result = (async () => {
        try {
            let snapshots = 0;
            for await (const rows of new Dvisor(2).execSql(`SELECT sum(l_quantity) AS q FROM '${from}'`)) {
                snapshots++;
            }
            return { outcome: 'completed', snapshots };
        } catch (e) {
            return { outcome: 'rejected', isDvisorError: e instanceof DvisorError, kind: e.kind, message: e.message };
        }
    })();
</script>
</body>
</html>
